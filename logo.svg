<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Dockrr</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)"/>

  <g transform="translate(0 -24)">
  <!-- the dock, two apps either side of the cat -->
  <rect x="72" y="344" width="368" height="72" rx="24" fill="#ffffff" fill-opacity="0.2"/>
  <g fill="#ffffff" fill-opacity="0.55">
    <rect x="94" y="362" width="36" height="36" rx="10"/>
    <rect x="142" y="362" width="36" height="36" rx="10"/>
    <rect x="334" y="362" width="36" height="36" rx="10"/>
    <rect x="382" y="362" width="36" height="36" rx="10"/>
  </g>

  <!-- the cat: a loaf sitting on the dock, its tail along it -->
  <path d="M344 336 C384 338 408 322 402 292" fill="none" stroke="#ffffff"
        stroke-width="18" stroke-linecap="round"/>
  <path fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" d="M164 344
           C164 288 178 250 196 232
           L200 150 L246 204
           Q256 201 266 204
           L312 150 L316 232
           C334 250 348 288 348 344 Z"/>
  <!-- eyes shut, content -->
  <g fill="none" stroke="#5b3fd6" stroke-width="9" stroke-linecap="round">
    <path d="M212 270 q14 12 28 0"/>
    <path d="M272 270 q14 12 28 0"/>
  </g>
  <path d="M249 290 h14 l-7 8 Z" fill="#5b3fd6"/>
  </g>
</svg>
